services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres_pgvector_arize
    environment:
      POSTGRES_DB: ai_documents_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  shop-api:
    build: ./shop-api
    container_name: shop_api_demo
    ports:
      - '3001:8000'
    restart: unless-stopped

volumes:
  postgres_data:
